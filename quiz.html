      <div class="page-head"><p class="label">ARCHIVE &middot; Test your eye</p><h1>Quiz</h1><p class="standfirst">Ten questions about the shows, designers and faces of the archive.</p></div>

        <div class="qz" id="qz" aria-live="off">
          <noscript><p>The quiz needs JavaScript. You can still read about everything on the <a href="designers.html">Designers</a>, <a href="runways.html">Runways</a> and <a href="models.html">Models</a> pages.</p></noscript>

        <script type="application/json" id="qzData">[{"q": "Which show ended with two robots spraying a white dress?", "a": ["McQueen: No. 13", "Valentino: The Last Show", "Prada: Banal Eccentricity", "Gucci: Velvet and Satin"], "c": 0, "e": "At the finale of McQueen’s “No. 13”, two robots from a car factory sprayed Shalom Harlow’s white dress as she turned on a platform.", "u": "runway-mcqueen-1999.html", "ul": "the McQueen show"}, {"q": "Which model turned on the platform in that white dress?", "a": ["Shalom Harlow", "Kate Moss", "Naomi Campbell", "Linda Evangelista"], "c": 0, "e": "Shalom Harlow starred in the finale of “No. 13” in September 1998.", "u": "model-shalom-harlow.html", "ul": "Shalom Harlow"}, {"q": "Whose song did four supermodels lip-sync at Versace’s 1991 finale?", "a": ["George Michael", "Madonna", "Prince", "Nirvana"], "c": 0, "e": "They lip-synched to “Freedom! ’90” by George Michael, re-creating the music video that David Fincher had directed the year before.", "u": "runway-versace-1991.html", "ul": "the Versace finale"}, {"q": "How long was the ovation at Valentino’s last couture show?", "a": ["30 seconds", "2 minutes", "5 minutes", "15 minutes"], "c": 2, "e": "The audience applauded for five minutes. Every model wore the same lipstick-red dress in the finale.", "u": "runway-valentino-2008.html", "ul": "Valentino’s last show"}, {"q": "Who designed the 1993 grunge collection for Perry Ellis?", "a": ["Marc Jacobs", "Tom Ford", "Calvin Klein", "John Galliano"], "c": 0, "e": "Marc Jacobs mixed chiffon with Doc Martens, plaid shirts and baggy nightdresses.", "u": "runway-perry-ellis-1993.html", "ul": "the grunge collection"}, {"q": "Which model was named the “Face of the 20th Century” by the Metropolitan Museum of Art in 1993?", "a": ["Christy Turlington", "Linda Evangelista", "Naomi Campbell", "Kate Moss"], "c": 0, "e": "Christy Turlington got the title in 1993, the year after she opened the Perry Ellis grunge show.", "u": "model-christy-turlington.html", "ul": "Christy Turlington"}, {"q": "Who was the creative director behind Gucci’s Fall/Winter 1995 show?", "a": ["Tom Ford", "Marc Jacobs", "Donatella Versace", "Miuccia Prada"], "c": 0, "e": "Tom Ford had almost quit after the previous season, then sent out more than 50 looks in velvet and satin.", "u": "runway-gucci-1995.html", "ul": "the Gucci show"}, {"q": "Whose portrait by Giovanni Boldini was printed on the invitations to Galliano’s 1998 Dior show?", "a": ["Marchesa Casati", "Coco Chanel", "Audrey Hepburn", "Elizabeth Taylor"], "c": 0, "e": "Galliano based the collection on the heiress Marchesa Casati.", "u": "runway-dior-1998.html", "ul": "the Dior show"}, {"q": "Who first wore the Versace jungle dress, on the runway in Milan?", "a": ["Amber Valletta", "Jennifer Lopez", "Naomi Campbell", "Gisele Bündchen"], "c": 0, "e": "Amber Valletta wore it first, in autumn 1999. Jennifer Lopez made it famous at the 42nd Grammy Awards in 2000.", "u": "runway-versace-2000.html", "ul": "the jungle dress"}, {"q": "Where was Gisele Bündchen spotted by a model agent at 14?", "a": ["In a shopping mall", "At a concert", "At a modeling school", "On a beach"], "c": 0, "e": "An agent from Elite Model Management spotted her in a shopping mall in 1994.", "u": "model-gisele-bundchen.html", "ul": "Gisele Bündchen"}, {"q": "Which magazine’s photos by Corinne Day made Kate Moss the “anti-supermodel”?", "a": ["The Face", "Vogue", "Time", "Elle"], "c": 0, "e": "Corinne Day’s photographs in The Face, in 1990, gave her the name.", "u": "model-kate-moss.html", "ul": "Kate Moss"}, {"q": "Jean Paul Gaultier made his cone-shaped bra for whose tour?", "a": ["Madonna’s Blond Ambition tour", "Prince’s Purple Rain tour", "Cher’s farewell tour", "Kylie Minogue’s Fever tour"], "c": 0, "e": "He created it for Madonna’s Blond Ambition tour in 1990.", "u": "designer-gaultier.html", "ul": "Jean Paul Gaultier"}]</script>
